# ─────────────────────────────────────────────────────────────────────────────
#  VERIFIED FACTS DATABASE
#  Every claim a video makes must point to an entry here (the verifier rejects
#  scripts that state numbers or facts not found in their cited entries).
#
#  status:
#    confirmed  – stated by Rockstar/Take-Two or an official storefront/platform.
#                 May be narrated as plain fact.
#    reported   – reputable press reporting or a company's own claim that needs
#                 attribution. Narration must attribute it ("according to…",
#                 "Rockstar says…", "reportedly…").
#    rumor      – insiders/leakers, not confirmed. Narration must say so and the
#                 video shows a RUMOR badge. Never used in titles.
#    debunked   – a false claim. Only usable in "myth buster" videos, framed as false.
#
#  review_after_days: after this many days since verified_on the fact is
#  "stale" and blocked until someone re-checks it and updates verified_on.
#  valid_until: after this date the fact is retired automatically.
#
#  Seeded 2026-11-17 from the sources listed under each entry.
# ─────────────────────────────────────────────────────────────────────────────

